name: Bump SDK versions in docs

# Opens a draft PR bumping the iOS / Android SDK versions referenced in the docs
# whenever radar-sdk-ios or radar-sdk-android publishes a newer stable release.
#
# Prerequisites (one-time, repo/org admin):
#   1. Settings -> Actions -> General -> Workflow permissions ->
#      enable "Allow GitHub Actions to create and approve pull requests".
#   2. A `DOCS_BOT_TOKEN` secret (fine-grained PAT or GitHub App token) with
#      contents:write + pull-requests:write on this repo and org members:read.
#      The default GITHUB_TOKEN cannot reliably request TEAM reviewers and does
#      not trigger downstream checks (e.g. Mintlify's PR preview).

on:
  schedule:
    - cron: "0 13 * * *" # daily ~09:00 ET. Scheduled runs fire only from the default branch.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: ios
            repo: radarlabs/radar-sdk-ios
            file: sdk/ios.mdx
            branch: automated/bump-ios-sdk
          - sdk: android
            repo: radarlabs/radar-sdk-android
            file: sdk/android.mdx
            branch: automated/bump-android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect latest release and update docs
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${{ matrix.repo }}/releases/latest" --jq .tag_name)
          echo "Latest ${{ matrix.sdk }} release: $latest"
          node .github/scripts/bump-sdk-version.mjs "${{ matrix.sdk }}" "$latest" "${{ matrix.file }}" >> "$GITHUB_OUTPUT"

      - name: Create or update draft PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DOCS_BOT_TOKEN }}
          branch: ${{ matrix.branch }}
          base: main
          draft: true
          commit-message: "docs: bump ${{ matrix.sdk }} SDK to ${{ steps.bump.outputs.version }}"
          title: "Bump ${{ matrix.sdk }} SDK docs to ${{ steps.bump.outputs.version }}"
          body: |
            Automated version bump.

            `${{ matrix.repo }}` published **${{ steps.bump.outputs.version }}**; the docs currently
            reference `${{ steps.bump.outputs.current }}`. This PR updates the install snippets in
            `${{ matrix.file }}`.

            Please verify against the release notes before merging.
          team-reviewers: sdk
          labels: |
            automated
            sdk-version-bump
